[project]
name = "lazy-capitalist-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
